[TDeck_Pro]
extends = esp32_base
board = tdeck-pro
build_flags =
  ${esp32_base.build_flags}
  -I variants/tdeck-pro
  -D TDECK_PRO
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D PIN_BOARD_SDA=13
  -D PIN_BOARD_SCL=14
  -D PIN_USER_BTN=0
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=130.0f
  -D SX126X_RX_BOOSTED_GAIN=1
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/tdeck-pro>
lib_deps =
  ${esp32_base.lib_deps}
  lewisxhe/XPowersLib @ ^0.2.7

[env:TDeck_Pro_repeater]
extends = TDeck_Pro
build_flags =
  ${TDeck_Pro.build_flags}
  -D ADVERT_NAME='"TDeck Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${TDeck_Pro.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${TDeck_Pro.lib_deps}
  ${esp32_ota.lib_deps}

[env:TDeck_Pro_room_server]
extends = TDeck_Pro
build_flags =
  ${TDeck_Pro.build_flags}
  -D ADVERT_NAME='"TDeck Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${TDeck_Pro.build_src_filter}
  +<../examples/simple_room_server>
lib_deps =
  ${TDeck_Pro.lib_deps}
  ${esp32_ota.lib_deps}

[env:TDeck_Pro_companion_radio_ble]
extends = TDeck_Pro
build_flags =
  ${TDeck_Pro.build_flags}
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
;  -D ENABLE_PRIVATE_KEY_IMPORT=1
;  -D ENABLE_PRIVATE_KEY_EXPORT=1
build_src_filter = ${TDeck_Pro.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio>
lib_deps =
  ${TDeck_Pro.lib_deps}
  densaugeo/base64 @ ~1.4.0